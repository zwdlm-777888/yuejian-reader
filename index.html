<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅见</title>
<meta name="theme-color" id="metaTheme" content="#cfe6d0">
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --bg:#cfe6d0;--card:#f7fbf4;--paper:#f2f8ec;--line:#d7e3d5;--ink:#22302a;--muted:#5e7263;
    --brand:#2e7d54;--brand-d:#256b47;--chip:#e6efe4;
    --panel:#eef5ea;--hover:#e9f4ea;--active:#d5ebd9;--btn:#fbfdf8;--btn-hover:#f0f6ec;
    --mark:#ffe28a;--mark-active:#e8890c;
    --pill-bg:#e2f0e4;--pill-fg:#1d5c38;--code:#f3f4f6;--split:#b9cdbc;
    --ok-bg:#e9f7f0;--ok-fg:#0f7b5a;--ok-line:#bfe6d5;
    --err-bg:#fdecea;--err-fg:#c0392b;--err-line:#f3c4bd;
    --warn-bg:#fff8e6;--warn-fg:#7a5b12;--warn-line:#f0d999;
  }
  /* 主题：暗色（深灰底·青绿点缀·暖白字） */
  html[data-theme="tavern"]{
    --topbar:#15161a;--topbar-line:#2c2f34;
    --bg:#1d1f23;--card:#282a2e;--paper:#232529;--line:#3d4045;--ink:#e8e4da;--muted:#a8adb3;
    --brand:#45b8a5;--brand-d:#3aa392;--chip:#33363b;
    --panel:#222428;--hover:#2f3338;--active:#3a4a45;--btn:#2e3136;--btn-hover:#3a3e44;
    --mark:#6b5a1e;--mark-active:#c07b1f;
    --pill-bg:#33373c;--pill-fg:#a9b8b0;--code:#33363b;--split:#4a4f56;
    --ok-bg:#252c28;--ok-fg:#8fb8a5;--ok-line:#2e3a34;
    --err-bg:#332522;--err-fg:#d99a90;--err-line:#4a322e;
    --warn-bg:#2e2a1e;--warn-fg:#c9a55e;--warn-line:#463d28;
  }
  /* 主题：酒馆（照 SillyTavern 界面：深藏青底·橙粉点缀） */
  html[data-theme="sillytavern"]{
    --topbar:#2b2d31;--topbar-line:#2b2d31;
    --bg:#2a3142;--card:#2c3444;--paper:#242736;--line:#3a4152;--ink:#e8e5e0;--muted:#9a98a8;
    --brand:#b9705c;--brand-d:#a5624e;--chip:#30384a;
    --panel:#2c3446;--hover:#303950;--active:#40343a;--btn:#2e3646;--btn-hover:#364050;
    --mark:#6b4a2a;--mark-active:#c07b3f;
    --pill-bg:#3a2f2e;--pill-fg:#e2a48d;--code:#30384a;--split:#475062;
    --ok-bg:#343f52;--ok-fg:#c9ccd4;--ok-line:#434e62;
    --err-bg:#343f52;--err-fg:#c9ccd4;--err-line:#434e62;
    --warn-bg:#343f52;--warn-fg:#c9ccd4;--warn-line:#434e62;
  }
  /* 酒馆主题专属：正文文字暖棕（东哥指定 R158/G112/B84）、目录文字压暗 */
  html[data-theme="sillytavern"] .content .body{color:#ab7060}
  html[data-theme="sillytavern"] .content h3{color:#ab7060}
  html[data-theme="sillytavern"] .chap{color:#c2bfcb}
  html[data-theme="sillytavern"] .msg{color:#c9ccd4;font-weight:600}
  /* 主题：羊皮纸（米黄仿旧） */
  html[data-theme="parchment"]{
    --bg:#e6dabf;--card:#f4ead2;--paper:#faf3e0;--line:#d6c69e;--ink:#46392a;--muted:#8a7a5e;
    --brand:#8b5e34;--brand-d:#774e2b;--chip:#e8dcbe;
    --panel:#efe4c8;--hover:#ecdfbd;--active:#e3d2a6;--btn:#f7efdb;--btn-hover:#efe4c8;
    --mark:#f0d17c;--mark-active:#d9a53f;
    --pill-bg:#ecdfbd;--pill-fg:#6b4f2a;--code:#eee2c4;--split:#c2b184;
    --ok-bg:#e8e6c9;--ok-fg:#5f6b2a;--ok-line:#c9c58e;
    --err-bg:#f0d3c8;--err-fg:#8f3b26;--err-line:#d9a893;
    --warn-bg:#f2e3bb;--warn-fg:#8a6a1f;--warn-line:#dcc98a;
  }
  /* 主题：纯白（极简黑白灰） */
  html[data-theme="white"]{
    --bg:#f2f3f5;--card:#ffffff;--paper:#ffffff;--line:#dde1e6;--ink:#22272e;--muted:#6b7480;
    --brand:#2e6f8e;--brand-d:#255d78;--chip:#e9edf1;
    --panel:#f4f6f8;--hover:#eef2f5;--active:#dfeaf0;--btn:#ffffff;--btn-hover:#eef2f5;
    --mark:#ffe9a8;--mark-active:#f0a92e;
    --pill-bg:#e9edf1;--pill-fg:#3c4a58;--code:#eef1f4;--split:#c4cbd3;
    --ok-bg:#e8f4ee;--ok-fg:#1c7a52;--ok-line:#bfe0d1;
    --err-bg:#fdeceb;--err-fg:#c0392b;--err-line:#f3c4bd;
    --warn-bg:#fff6e0;--warn-fg:#8a6d1a;--warn-line:#ecd9a0;
  }
  /* 主题：樱吹雪卷（樱粉白系·女性向：近白粉纸·暗玫粉主色） */
  html[data-theme="sakura"]{
    --topbar:#fbdfe7;--topbar-line:#f3ccd8;
    --bg:#fbe9f0;--card:#fff3f7;--paper:#fef8fa;--line:#f0ccd8;--ink:#5f3a44;--muted:#a07280;
    --brand:#d97289;--brand-d:#c25e76;--chip:#fbe3ea;
    --panel:#fae9ee;--hover:#f9e6ec;--active:#f6d7e1;--btn:#fff5f8;--btn-hover:#faeaef;
    --mark:#ffd9e2;--mark-active:#e87f9d;
    --pill-bg:#f9dfe8;--pill-fg:#a03055;--code:#faeef2;--split:#e7b9c8;
    --ok-bg:#e8f6ec;--ok-fg:#2e7d54;--ok-line:#c2e5cf;
    --err-bg:#fdeceb;--err-fg:#c0392b;--err-line:#f3c4bd;
    --warn-bg:#fff6e0;--warn-fg:#8a6d1a;--warn-line:#ecd9a0;
  }
  /* 主题：豆蔻温笺（豆沙粉系·稳重耐读：豆沙纸·暗豆沙主色） */
  html[data-theme="dousha"]{
    --topbar:#f3d9d8;--topbar-line:#e6cbc9;
    --bg:#eedddd;--card:#f9eae8;--paper:#fbf1ef;--line:#dcc3c1;--ink:#4d3a38;--muted:#967572;
    --brand:#b05e6e;--brand-d:#9c505f;--chip:#f2dcd9;
    --panel:#f5e4e1;--hover:#f4e1dd;--active:#eed2cd;--btn:#fdf3f1;--btn-hover:#f6e6e2;
    --mark:#ffd9c9;--mark-active:#e0906a;
    --pill-bg:#f1dbd7;--pill-fg:#8c4a56;--code:#f7ebe8;--split:#d5a8a2;
    --ok-bg:#eaf4ea;--ok-fg:#3a7a52;--ok-line:#c8e0cc;
    --err-bg:#fbe9e4;--err-fg:#b0402e;--err-line:#eccdc2;
    --warn-bg:#fff3dd;--warn-fg:#8a641a;--warn-line:#ecd6a0;
  }
  /* 主题：青峦染绢（古风宋瓷系：月白绢纸·深黛青主色·古铜补色，低饱和高灰调） */
  html[data-theme="qingluan"]{
    --topbar:#ebe6da;--topbar-line:#dcd5c4;
    --bg:#e6e0d2;--card:#f2eee4;--paper:#f6f3ec;--line:#d5cfbf;--ink:#33373d;--muted:#75726a;
    --brand:#3f5e60;--brand-d:#354f51;--chip:#e7e3d6;
    --panel:#edeadd;--hover:#ece8db;--active:#dde0d6;--btn:#f4f1ea;--btn-hover:#ebe7db;
    --mark:#e9dfc0;--mark-active:#c9a24e;
    --pill-bg:#e3ddcf;--pill-fg:#3f5e60;--code:#eef0ec;--split:#c2bca9;
    --ok-bg:#e4ece2;--ok-fg:#4a7a5a;--ok-line:#c5d6c4;
    --err-bg:#f0e2da;--err-fg:#a5502f;--err-line:#dcc4b3;
    --warn-bg:#efe7cf;--warn-fg:#8a6d2a;--warn-line:#dbcda0;
  }
  *{box-sizing:border-box}
  /* 整页锁死一屏：外层不再出滚动条，只有书架/章节/正文三处内滚 */
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:14px;line-height:1.6}
  .wrap{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:8px;min-height:0}
  h1{font-size:18px;margin:0;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:5px;flex:0 0 auto;background:var(--topbar,transparent);border:1px solid var(--topbar-line,transparent);border-radius:10px;padding:5px 10px}
  .ver{font-size:11px;font-weight:400;opacity:.6;white-space:nowrap}
  .pill{font-size:11.5px;background:var(--pill-bg);color:var(--pill-fg);border-radius:20px;padding:2px 9px;font-weight:400}
  /* 顶栏控件文字标签（主题/字体加粗）：不换行、不占位过大，随主题文字色走 */
  .ctl-label{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:0 0 auto}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--btn);color:var(--ink)}
  button{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{background:var(--btn-hover);border-color:var(--split)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .msg{padding:7px 12px;border-radius:8px;font-size:12.5px;margin-top:7px;display:none}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-line)}
  .msg.err{display:block;background:var(--err-bg);color:var(--err-fg);border:1px solid var(--err-line)}
  .msg.warn{display:block;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
  /* 主区：书架 | 拖拽条 | 阅读面板，占满剩余高度 */
  .layout{flex:1;display:flex;min-height:0}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .pane.shelf{flex:0 0 auto;width:300px;min-width:140px}
  .pane.right{flex:1;min-width:0}
  .pane h2{font-size:14px;margin:0;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;overflow:hidden}
  .pane h2 .sp{flex:1}
  .mini{font-size:12px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--btn);cursor:pointer;color:var(--muted)}
  .mini:hover{background:var(--panel);color:var(--ink)}
  select.mini{padding:4px 7px;font-size:12px;color:var(--ink)}
  /* 滑杆不能套 .mini 的 padding——Chrome 会把滑块活动范围缩进 padding 里，拖不到头。单独给零 padding 样式 */
  input[type=range].mini{padding:0;border:0;background:transparent;height:18px;cursor:pointer}
  input[type=range].mini::-webkit-slider-thumb{width:14px;height:14px}
  .mini.speak{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;padding:4px 12px}
  .mini.speak:hover{background:var(--brand-d);border-color:var(--brand-d)}
  /* 统一按钮色：章节/全屏/字号与「加载书架」同色；退出工具同色相、明度提亮 10% */
  #btnToggleChap,#btnFull,#btnFont,#btnResetView{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  #btnToggleChap:hover,#btnFull:hover,#btnFont:hover,#btnResetView:hover{background:var(--brand-d);border-color:var(--brand-d)}
  /* [demo] 沉浸全屏：藏大顶栏/消息行/书架/章节目录，只留细阅读排＋搜索＋正文＋底部加载条 */
  body.immersive #topbar,body.immersive #msgRow{display:none}
  body.immersive #shelfPane,body.immersive #splitShelf,body.immersive #btnOpenShelf{display:none!important}
  body.immersive #chapPane,body.immersive #splitChap,body.immersive #loadCard{display:none!important}
  /* 退出工具：主色的补色（每主题硬编码，色环转 180°、明度饱和度同主色），背景由 applyTheme 按主题设置 */
  #btnQuit{color:#fff;font-weight:600}
  #btnQuit:hover{filter:brightness(1.1)}
  #btnQuit:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .voice-state{font-size:12px;white-space:nowrap}
  .pdfview{position:relative;flex:1;min-height:0;background:var(--card);display:flex;flex-direction:column}
  .pdfview iframe{flex:1;border:0;display:block;background:#eef3ea;min-height:0}
  .close-pdf{position:absolute;top:9px;right:12px;z-index:5;background:var(--btn);box-shadow:0 2px 8px rgba(0,0,0,.18);font-weight:600}
  .list{flex:1;min-height:0;overflow:auto}
  .item{padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .item:hover{background:var(--hover)}
  .item.active{background:var(--active)}
  .item .nm{flex:1;word-break:break-all;font-size:13px}
  .item .meta{font-size:11.5px;color:var(--muted)}
  .ext{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--chip);color:#374151;white-space:nowrap}
  .ext.pdf{background:var(--err-bg);color:var(--err-fg)}
  .ext.epub{background:var(--ok-bg);color:var(--ok-fg)}
  /* 阅读：章节 | 拖拽条 | 正文 */
  .reader{flex:1;display:flex;min-height:0}
  .chapters{flex:0 0 auto;width:220px;min-width:120px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .chapters .h{font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .chapList{flex:1;min-height:0;overflow:auto}
  .chap{padding:7px 12px;font-size:13px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line);word-break:break-all}
  .chap:hover{background:var(--hover)}
  .chap.active{background:var(--active);color:var(--brand-d)}
  .content{flex:1;min-width:0;min-height:0;overflow:auto;background:var(--paper);padding:22px 36px}
  .contentWrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .searchbar{display:flex;gap:6px;align-items:center;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .searchbar input{flex:1;min-width:0;padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:var(--btn);color:var(--ink)}
  .content mark{background:var(--mark);color:inherit;padding:0;border-radius:2px}
  .content mark.active{background:var(--mark-active);color:#fff}
  .content h3{font-size:18px;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--line)}
  /* v5.3：正文行宽跟随正文框宽度。原 max-width:900px 写死，窗口拉大/字号变化行宽都不动。
     改为 100% 后：拖窗口改宽度 → 行宽实时跟随；字号变大 → 每行字数变少（阅读器正常排版）。 */
  .content .body{white-space:pre-wrap;font-size:16px;line-height:2.1;color:var(--ink);letter-spacing:.3px;max-width:100%;box-sizing:border-box;filter:brightness(var(--text-bright,1));font-weight:var(--body-bold,400);font-family:var(--body-font,"Microsoft YaHei","PingFang SC",system-ui,sans-serif)}
  /* 滚动条：细、低调，跟主题走，不刺眼 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--split);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}
  /* v5.1 任务3：字号五档改为行内 px（档位表 FONT_SIZES），原三档 class 规则废弃 */
  /* 首开引导页（README 渲染成正文） */
  .guideBody{max-width:100%;box-sizing:border-box;font-size:15px;line-height:1.9;white-space:normal;filter:brightness(var(--text-bright,1));font-family:var(--body-font,"Microsoft YaHei","PingFang SC",system-ui,sans-serif)}
  .guideBody .g-h2{font-size:16px;font-weight:600;margin:22px 0 10px;color:var(--brand-d);border-bottom:1px solid var(--line);padding-bottom:6px}
  .guideBody .g-h3{font-size:14px;font-weight:600;margin:16px 0 8px}
  .guideBody .g-p{margin:8px 0}
  .guideBody .g-li{margin:5px 0 5px 14px}
  .guideBody .g-quote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--brand);background:var(--panel);border-radius:0 8px 8px 0;color:var(--muted)}
  /* [demo] v5.2 划词翻译：选区末尾浮「译」钮＋结果气泡 */
  #btnTran{position:absolute;z-index:60;display:none;padding:2px 10px;font-size:12px}
  #tranTip{position:absolute;z-index:61;display:none;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:10px 12px;font-size:14px;line-height:1.7;
    color:var(--ink);white-space:normal}
  #tranTip .t-src{color:var(--muted);font-size:12px;margin-bottom:4px;word-break:break-all}
  .guideBody .g-hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
  .guideBody .g-table{border-collapse:collapse;margin:10px 0;width:100%;max-width:720px}
  .guideBody .g-table th,.guideBody .g-table td{border:1px solid var(--line);padding:5px 10px;font-size:13px;text-align:left}
  .guideBody .g-table th{background:var(--panel)}
  .empty{color:var(--muted);text-align:center;padding:80px 20px;font-size:13px}
  audio{width:300px;height:32px;flex:0 0 auto}
  #btnStop.hidden,audio.hidden{display:none}
  .hint{font-size:12px;color:var(--muted)}
  code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:12px}
  .hidden{display:none}
  /* 可拖拽竖分割条：鼠标停上出现左右箭头光标，按住可调宽 */
  .vsplit{flex:0 0 7px;cursor:col-resize;background:transparent;border-radius:4px;position:relative;z-index:3}
  .vsplit:hover,.vsplit.dragging{background:var(--split)}
  .vsplit::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:34px;border-radius:3px;background:var(--split);opacity:.8}
  .vsplit:hover::after,.vsplit.dragging::after{background:var(--brand)}
  /* 翻页按钮：浮在正文右下角；加深描边＋提高不透明度，浅色主题下也看得清 */
  .pagebtn{position:absolute;right:14px;bottom:14px;z-index:4;width:38px;height:38px;font-size:20px;line-height:1;
    padding:0;border-radius:50%;opacity:.85;background:var(--btn);color:var(--ink);
    border:1.5px solid var(--split);box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pagebtn:hover{opacity:1;background:var(--btn-hover)}
  #pgPrev{right:58px}
  /* PDF 视图的四钮从右往左排开，否则全叠在右下角一个点上（实测踩过的坑） */
  #pdfEnd{right:14px}
  #pdfNext{right:58px}
  #pdfPrev{right:102px}
  #pdfHome{right:146px}
  /* 首页/尾页钮：正文左下角，与右侧翻一屏的浮钮对称 */
  #pgHome,#pgEnd{left:14px}
  #pgEnd{left:58px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="topbar">阅见<span class="ver">v5.3</span><span class="pill">本地运行 · 图片不朗读</span><span id="voiceState" class="voice-state" style="font-weight:400"></span><span class="sp" style="flex:1"></span><b class="ctl-label">主题</b><select id="theme" class="mini" title="界面主题">
      <option value="">青笺缓阅（护眼）</option>
      <option value="tavern">墨窗夜读</option>
      <option value="sillytavern">灯檐阅卷</option>      <option value="parchment">故纸余温</option>

<script>
const $ = id => document.getElementById(id);
let books = [], curBook = null, chapters = [], curChap = 0;
// v5.1 任务3：字号三档扩五档，直接写 px；v5.3 扩六档 15/17/19/21/23/25，默认 15px（索引 0）
const FONT_SIZES=[15,17,19,21,23,25];
const DEFAULT_FONT_LEVEL=0;  // v5.3：六档 15/17/19/21/23/25，默认 15px（档位表首位）
let fontLevel = DEFAULT_FONT_LEVEL;

// 收起/展开书架：开关按钮在栏头最左，不会被窄栏裁掉；收起后左缘留「»」重开按钮
function setShelf(show){
  $("shelfPane").style.display=show?"":"none";
  $("splitShelf").style.display=show?"":"none";
  $("btnOpenShelf").style.display=show?"none":"";
}
$("btnToggleShelf").onclick=()=>setShelf(false);
$("btnOpenShelf").onclick=()=>setShelf(true);
$("btnToggleChap").onclick=()=>{
  const p=$("chapPane"),s=$("splitChap");
  const hidden=p.style.display==="none";
  p.style.display=hidden?"":"none";s.style.display=hidden?"":"none";
};

// 竖分割条拖拽：像资源管理器一样左右调宽，松手记住宽度
function makeSplit(bar,pane,storeKey,minW){
  let startX=0,startW=0,dragging=false;
  bar.addEventListener("mousedown",e=>{
    dragging=true;startX=e.clientX;startW=pane.getBoundingClientRect().width;
    bar.classList.add("dragging");e.preventDefault();
    document.body.style.cursor="col-resize";document.body.style.userSelect="none";
  });
  window.addEventListener("mousemove",e=>{
    if(!dragging)return;
    const w=Math.max(minW,startW+(e.clientX-startX));
    pane.style.width=w+"px";pane.style.flexBasis=w+"px";
  });
  window.addEventListener("mouseup",()=>{
    if(!dragging)return;
    dragging=false;bar.classList.remove("dragging");
    document.body.style.cursor="";document.body.style.userSelect="";
    storeState({[storeKey]:Math.round(pane.getBoundingClientRect().width)});
  });
}
makeSplit($("splitShelf"),$("shelfPane"),"shelf_w",140);
makeSplit($("splitChap"),$("chapPane"),"chap_w",120);

// 主题切换：换 html 的 data-theme，整套配色跟着变；选择记进 state.json
const THEME_BAR={"":"#cfe6d0","tavern":"#15161a","sillytavern":"#2b2d31","parchment":"#e6dabf","white":"#f2f3f5","sakura":"#fbe9f0","dousha":"#eedddd","qingluan":"#e6e0d2"};
// 各主题主色的精确补色（色环转 180°，明度饱和度同主色）：豆沙绿→绛紫、暗色→玫红、酒馆→青蓝、羊皮纸→靛蓝、纯白→赭橙、樱吹雪卷→粉青、豆蔻温笺→灰青绿
const THEME_QC={"":"#7d2e57","tavern":"#b84558","sillytavern":"#5ca5b9","parchment":"#34618b","white":"#8e4d2e","sakura":"#72d9c3","dousha":"#66b8a8","qingluan":"#96794f"};
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  $("theme").value = t || "";
  const m=document.getElementById("metaTheme");
  if(m) m.content=(THEME_BAR[t||""]||"#cfe6d0");
  const qc=THEME_QC[t||""]||"#7d2e57";   // 「清理并退出」按钮 = 主色补色
  $("btnQuit").style.background=qc;
  $("btnQuit").style.borderColor=qc;
  applyPaper(t || "");
  applyBodyPrefs(t || "");
}

// v5.1 任务7/8：正文文字明暗 + 字体，每主题各记各的
// 字体用 CSS 字体栈：指定了就用该字体打头，缺字自动回退到系统默认，不会方框图
const BODY_FONTS={
  song:'"SimSun","宋体","Songti SC",serif',
  kai:'"KaiTi","楷体","STKaiti",serif',
  fang:'"FangSong","仿宋","STFangsong",serif',
  hei:'"SimHei","黑体","Microsoft YaHei",sans-serif'
};
function applyBodyPrefs(t){
  const root=document.documentElement;
  const d=(savedState.text_dim||{})[t];
  root.style.setProperty("--text-bright", (d==null?100:Number(d))/100);
  const f=(savedState.body_font||{})[t]||"";
  if(f && BODY_FONTS[f]) root.style.setProperty("--body-font", BODY_FONTS[f]);
  else root.style.removeProperty("--body-font");
  $("bodyFont").value=f;
  $("textDim").value=d==null?100:d;
  // 去空行是全局开关，不属于主题，回显一次即可
  $("btnBlank").textContent="去空行："+(savedState.strip_blank?"开":"关");
}
$("textDim").addEventListener("input",()=>{
  document.documentElement.style.setProperty("--text-bright",Number($("textDim").value)/100);
});
$("textDim").addEventListener("change",()=>{
  const t=$("theme").value||""; const d=Object.assign({},savedState.text_dim||{});
  d[t]=Number($("textDim").value); storeState({text_dim:d});
});
$("bodyFont").addEventListener("change",()=>{
  const t=$("theme").value||""; const f=Object.assign({},savedState.body_font||{});
  const v=$("bodyFont").value; if(v) f[t]=v; else delete f[t];
  storeState({body_font:f}); applyBodyPrefs(t);
});
// 去空行：全局开关，改变的是 chapters 里的文本，切换时重新读原文再按新状态处理（保留当前章）
$("btnBlank").onclick=async()=>{
  const on=!savedState.strip_blank;
  storeState({strip_blank:on});
  $("btnBlank").textContent="去空行："+(on?"开":"关");
  if(curBook && curBook.ext==="txt" && chapters[curChap]){
    const keep=curChap;
    const activeEl=$("bookList").querySelector(".item.active");
    await openBook(curBook,activeEl);
    renderChap(Math.min(keep,chapters.length-1));
    msg($("scanMsg"),on?"已压掉 TXT 多余空行。":"已恢复原样空行。","ok");
  }
};

// 底纹自定义图片＋可调遮罩：每个主题各配各的图，记进 state.json 的 paper 字段
// paper = { "<主题>": {"image":"图片路径","dim":35}, ... }（dim=遮罩浓度 0-90）
// 遮罩色取各主题纸色（硬编码表，与 CSS --paper 一致）：亮主题白雾压亮图、暗主题深雾压暗图
const THEME_PAPER={"":"#f2f8ec","tavern":"#232529","sillytavern":"#242736","parchment":"#faf3e0","white":"#ffffff","sakura":"#fef8fa","dousha":"#fbf1ef","qingluan":"#f6f3ec"};
function applyPaper(t,dimOverride){
  const c=$("content"), cfg=(savedState.paper||{})[t];
  const hasImg = cfg && cfg.image;
  if(hasImg){
    // 优先用滑杆当前值（拖动即时预览），没传才用存好的浓度
    const dim=Math.max(0,Math.min(90,dimOverride!=null?dimOverride:(Number(cfg.dim)||0)))/100;
    const rgb=hexToRgb(THEME_PAPER[t]||"#f2f8ec");
    const url="/api/paper_file?path="+encodeURIComponent(cfg.image);
    c.style.backgroundImage="linear-gradient(rgba("+rgb+","+dim+"),rgba("+rgb+","+dim+")),url(\""+url+"\")";
    c.style.backgroundSize="auto,cover";
    c.style.backgroundPosition="center";
    c.style.backgroundRepeat="no-repeat";
    c.style.backgroundAttachment="scroll,scroll";
  }else{
    c.style.backgroundImage="";
    c.style.backgroundSize="";
    c.style.backgroundPosition="";
    c.style.backgroundRepeat="";
    c.style.backgroundAttachment="";
  }
  // 滑杆值：拖动预览时（传了 dimOverride）不回写滑杆，否则拖柄会被拽回去拖不动
  $("paperDim").value = dimOverride!=null ? dimOverride : (hasImg ? (Number(cfg.dim)||0) : 35);
  $("btnClearPaper").style.display = hasImg ? "" : "none";
}
function hexToRgb(h){
  h=h.replace("#","");
  if(h.length===3) h=h.split("").map(x=>x+x).join("");
  const n=parseInt(h,16);
  if(isNaN(n)) return "255,255,255";
  return ((n>>16)&255)+","+((n>>8)&255)+","+(n&255);
}
function savePaper(){
  const t=$("theme").value || "";
  const p=Object.assign({},savedState.paper||{});
  const cfg=p[t]||{};
  if(cfg.image) p[t]={image:cfg.image,dim:Number($("paperDim").value)||0};
  else delete p[t];
  storeState({paper:p});
}
$("theme").addEventListener("change",()=>{ applyTheme($("theme").value); storeState({theme:$("theme").value||""}); });   // 选择落盘，重启保留

// 底纹：弹系统窗口选图片 → 记到当前主题名下并立即应用
// 选图窗口从"上次选图的目录"开始（跟书架路径分开记），没有记录才退回书架路径
$("btnPaper").onclick=async()=>{
  let d;
  try{ d=await api("/api/pick_image?path="+encodeURIComponent(savedState.paper_dir||$("path").value.trim()),null,200000); }
  catch(e){ msg($("scanMsg"),"选图失败："+(e.message||e),"err"); return; }
  if(!d.path) return; // 取消，不动
  const dir=d.path.replace(/[\\/][^\\/]*$/,"");          // 取图片所在目录，下次选图从这里开
  const t=$("theme").value || "";
  const p=Object.assign({},savedState.paper||{});
  p[t]={image:d.path,dim:Number($("paperDim").value)||35};
  storeState({paper:p,paper_dir:dir});
  applyPaper(t);
  msg($("scanMsg"),"底纹已换，拖旁边的滑杆调遮罩，图看不清字就往右拉","ok");
};
// 遮罩滑杆：拖动即时预览（用滑杆当前值），松手才写入
$("paperDim").addEventListener("input",()=>{ if((savedState.paper||{})[$("theme").value||""]) applyPaper($("theme").value||"",Number($("paperDim").value)); });
$("paperDim").addEventListener("change",savePaper);
// 清除当前主题的底纹
$("btnClearPaper").onclick=()=>{
  const t=$("theme").value || "";
  const p=Object.assign({},savedState.paper||{});
  delete p[t];
  storeState({paper:p});
  applyPaper(t);
  msg($("scanMsg"),"已清除该主题的底纹","ok");
};

// 字号单一入口：点按钮换下一档、一键恢复回默认，都走这里，避免两处逻辑分叉
function setFont(size){
  $("btnFont").textContent="字号 "+size;
  const body=document.getElementById("bodyText");
  if(body) body.style.fontSize=size+"px";
}
$("btnFont").onclick=()=>{
  fontLevel=(fontLevel+1)%FONT_SIZES.length;
  const size=FONT_SIZES[fontLevel];
  setFont(size);
  storeState({font_level:size});  // v5.3：字号档位落盘，启动时恢复上次设定
  if(!document.getElementById("bodyText")) msg($("scanMsg"),"字号已设为 "+size+"px，打开章节后生效。","ok");
};
// v5.3 加粗开关：全局开关（与字号同层），走 CSS 变量控制正文 font-weight
function setBold(on){
  $("btnBold").textContent="加粗："+(on?"开":"关");
  const root=document.documentElement;
  if(on) root.style.setProperty("--body-bold","700");
  else root.style.removeProperty("--body-bold");
}
$("btnBold").onclick=()=>{
  const on=!(savedState.body_bold);
  setBold(on);
  storeState({body_bold:on});
};
setFont(FONT_SIZES[fontLevel]);

// 一键恢复：主题、字体、字号回默认；底纹全清；两根滑杆归中
// 走与正常切换同一条落盘链路：清掉字体记忆 → 主题下拉回空 → applyTheme 全量刷新（配色/补色/底纹/正文首选项）→ 落盘
$("btnResetView").onclick=()=>{
  // 只清「默认主题」名下的字体/明暗记忆，别把用户在其他主题里存的偏好一起抹掉
  const f=Object.assign({},savedState.body_font||{}); delete f[""];
  const td=Object.assign({},savedState.text_dim||{}); delete td[""];
  storeState({theme:"", body_font:f, text_dim:td, paper:{}, font_level:FONT_SIZES[DEFAULT_FONT_LEVEL], body_bold:false});  // 底纹全清：所有主题的底纹图一并抹掉，回到干净初始；字号/加粗也落回默认
  applyTheme("");
  fontLevel=DEFAULT_FONT_LEVEL; setFont(FONT_SIZES[fontLevel]);  // 字号回默认 15px
  setBold(false);  // 加粗回默认关闭
  // 两根滑杆归正中：底纹遮罩量程 0~90 → 45，正文明暗量程 55~145 → 100
  $("paperDim").value=45;
  $("textDim").value=100;
  msg($("scanMsg"),"已恢复默认主题、字体和字号（15px），底纹已清除，两根滑杆已归中。","ok");
};

function human(n){if(!n)return "0";const u=["B","KB","MB","GB","TB"];let i=0,x=n;while(x>=1024&&i<4){x/=1024;i++;}return (x>=10?x.toFixed(0):x.toFixed(1))+" "+u[i];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function msg(el,text,type){el.className="msg "+(type||"ok");el.textContent=text;}
async function api(url,body,timeoutMs,extSignal){
  timeoutMs=timeoutMs||30000;
  const ctrl=new AbortController();
  if(extSignal){ if(extSignal.aborted) ctrl.abort(); else extSignal.addEventListener("abort",()=>ctrl.abort()); }
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  let opt={signal:ctrl.signal};
  if(body){opt={method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal};}
  try{
    const r=await fetch(url,opt);
    if(!r.ok) throw new Error("HTTP error");
    return await r.json();
  }catch(e){
    if(e.name==="AbortError") throw new Error("请求超时，后台服务没响应——请关掉黑窗口重新双击启动工具.bat");
    if(e instanceof TypeError) throw new Error("连不上后台服务——黑窗口是不是关了？重新双击启动工具.bat");
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

// ---- v5.1 任务1：合并「浏览」+「加载书架」为一个按钮 ----
// 点按钮 → 弹窗选文件夹 → 选完自动装书架；点「取消」什么都不做。
// 扫描加载拆成独立的 loadShelf()，启动自动恢复直接调它，不弹选文件夹的框。
async function loadShelf(){
  const b=$("btnScan");b.disabled=true;b.textContent="扫描中…";
  let r;
  try{
    r=await api("/api/scan",{path:$("path").value},120000);
  }catch(e){
    b.disabled=false;b.textContent="加载书架";
    msg($("scanMsg"),"扫描失败："+(e.message||e),"err");return;
  }
  b.disabled=false;b.textContent="加载书架";
  if(!r.ok){msg($("scanMsg"),r.error||"扫描失败","err");return;}
  books=r.books;
  $("bookCount").textContent=`（${books.length} 本读物，${r.images} 张图片已忽略）`;
  $("bookList").innerHTML=books.length?books.map((bk,i)=>
    `<div class="item" data-i="${i}">
       <span class="ext ${bk.ext}">${bk.ext.toUpperCase()}</span>
       <span class="nm">${esc(bk.name)}<br><span class="meta">${esc(bk.rel)}　${human(bk.size)}${bk.ext==='pdf'?'　· 点击查看':''}</span></span>
     </div>`).join(""):'<div class="empty">这个文件夹里没找到 txt / md / epub / pdf</div>';
  $("bookList").querySelectorAll(".item").forEach(el=>{
    el.onclick=async()=>{
      const bk=books[+el.dataset.i];
      if(bk.ext==="pdf"){
        // 当前窗口内嵌 PDF 查看器，不跳新窗口；PDF 不朗读
        $("bookList").querySelectorAll(".item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        curBook=bk;
        $("readerTitle").textContent="— "+bk.name+"（PDF · 仅阅读）";
        $("reader").style.display="none";
        $("splitChap").style.display="none";
        hideAudio();
        $("pdfview").style.display="flex";
        pdfOpen(bk.path);
        msg($("scanMsg"),"PDF 已在当前窗口打开，可用浮钮或滚轮翻页。扫描版无文字层，不朗读。","warn");
        return;
      }
      // 从 PDF 切回文字书时，收起 PDF 区
      if($("pdfview").style.display!=="none"){
        $("pdfview").style.display="none";
        $("pdfFrame").src="about:blank";
        $("reader").style.display="";
        $("splitChap").style.display="";
      }
      if(!bk.can_read){msg($("scanMsg"),"这种格式暂不支持阅读。","warn");return;}
      await openBook(bk,el);
    };
  });
  storeState({last_path:$("path").value.trim()});
  msg($("scanMsg"),`扫描完成：${books.length} 本读物。${r.images} 张图片已自动跳过，不参与朗读。`,"ok");
  // 恢复上次读到的书 + 章节
  if(savedState.last_book){
    const idx=books.findIndex(b=>b.name===savedState.last_book);
    if(idx>=0){
      const el=$("bookList").querySelectorAll(".item")[idx];
      if(el) el.click();
      // openBook 是异步的，等它渲染完再跳章节
      const target=savedState.last_chapter||0;
      const wait=setInterval(()=>{
        if(chapters.length){
          renderChap(Math.min(target,chapters.length-1));
          msg($("scanMsg"),`已回到上次读到的《${savedState.last_book}》第 ${Math.min(target,chapters.length-1)+1} 节。`,"ok");
          clearInterval(wait);
        }
      },150);
      setTimeout(()=>clearInterval(wait),8000);
    }
  }
}

// ---- 正文搜索：当前章节内查找，高亮全部命中，▲▼ 跳转 ----
let hits = [], hitIdx = -1;

// ---- 首开引导：迷你 Markdown 渲染（标题/列表/表格/加粗/代码，够用即可） ----
// v5.1 任务4：渲染循环抽成公共 mdLite()，MD 书正文与引导页共用
function mdInline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
function mdTable(rs){
  let h="<table class='g-table'><tr>";
  rs[0].forEach(c=>h+="<th>"+mdInline(c)+"</th>");
  h+="</tr>";
  for(let i=1;i<rs.length;i++){ h+="<tr>"; rs[i].forEach(c=>h+="<td>"+mdInline(c)+"</td>"); h+="</tr>"; }
  return h+"</table>";
}
function mdLite(src){
  const lines=src.split(/\r?\n/);
  let out="",rows=[];
  for(const L of lines){
    if(/^\s*\|/.test(L)){
      if(/^\s*\|[\s:|-]+\|\s*$/.test(L)) continue;   // 表格分隔行跳过
      rows.push(L.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim()));
      continue;
    }
    if(rows.length){ out+=mdTable(rows); rows=[]; }
    if(/^#\s/.test(L)) continue;                      // 一级标题跳过（章节标题条里已有）
    if(/^\s*>\s?/.test(L)){                            // 引用行（> 别称：xxx）
      out+="<div class='g-quote'>"+mdInline(L.replace(/^\s*>\s?/,""))+"</div>";
      continue;
    }
    if(/^\s*<[^>]+>\s*$/.test(L.trim())||/^\s*<\/[^>]+>\s*$/.test(L)){   // 整行 HTML 块（<div>/<img> 等）原样放行
      out+=L.trim();
      continue;
    }
    if(/^#{2,6}\s/.test(L)){
      const n=L.match(/^#+/)[0].length;
      out+= n===2 ? "<div class='g-h2'>"+mdInline(L.replace(/^#+\s/,""))+"</div>"
                  : "<div class='g-h3'>"+mdInline(L.replace(/^#+\s/,""))+"</div>";
    }
    else if(/^\s*---+\s*$/.test(L)) out+="<hr class='g-hr'>";
    else if(/^\s*[-*]\s/.test(L)) out+="<div class='g-li'>• "+mdInline(L.replace(/^\s*[-*]\s/,""))+"</div>";
    else if(/^\s*\d+\.\s/.test(L)) out+="<div class='g-li'>"+mdInline(L)+"</div>";
    else if(L.trim()) out+="<div class='g-p'>"+mdInline(L)+"</div>";
    else out+="<div class='g-p'>&nbsp;</div>";        // 空行留一段空白，读着不挤
  }
  if(rows.length) out+=mdTable(rows);
  return out;
}
function renderGuide(src){
  $("content").innerHTML="<h3>阅见 · 使用说明</h3><div class='guideBody'>"+mdLite(src)+"</div>";
}

function renderBody(){
  // 按当前搜索词渲染正文（有词就把命中包上 <mark>）
  const c=chapters[curChap];
  const q=$("searchInput").value.trim();
  let inner, extraCls="";
  // v5.1 任务4：MD 书按语法渲染（复用 mdLite）；搜索时退回纯文本高亮（渲染后的 HTML 没法直接套 mark）
  if(curBook && curBook.ext==="md" && !q){
    inner=mdLite(c.text);
    extraCls=" guideBody";   // 借引导页的排版样式：不保留换行空白、段落有间距
  }else if(q){
    const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    let idx=0,out="",m;
    while((m=re.exec(c.text))){
      if(m[0].length===0){re.lastIndex++;continue;}
      out+=esc(c.text.slice(idx,m.index))+"<mark>"+esc(m[0])+"</mark>";
      idx=m.index+m[0].length;
    }
    inner=out+esc(c.text.slice(idx));
  }else{
    inner=esc(c.text);
  }
  $("content").innerHTML=`<h3>${esc(c.title)}</h3><div class="body${extraCls}" id="bodyText" style="font-size:${FONT_SIZES[fontLevel]}px">${inner}</div>`;
}

function updateSearchCount(){
  const q=$("searchInput").value.trim();
  if(!q){$("searchCount").textContent="";return;}
  $("searchCount").textContent=hits.length?("第 "+(hitIdx+1)+" / "+hits.length+" 处"):"无结果";
}

function applySearch(scrollFirst){
  hits=[...document.querySelectorAll("#bodyText mark")];
  hitIdx=scrollFirst&&hits.length?0:-1;
  hits.forEach((m,j)=>m.classList.toggle("active",j===hitIdx));
  if(scrollFirst&&hits.length) snapToScreen(hits[0]);   // 按屏跳：命中落在整屏上，不打乱页格
  updateSearchCount();
}

function jumpHit(dir){
  if(!hits.length)return;
  hitIdx=(hitIdx+dir+hits.length)%hits.length;
  hits.forEach((m,j)=>m.classList.toggle("active",j===hitIdx));
  snapToScreen(hits[hitIdx]);
  updateSearchCount();
}

// ---- v4.1 正文翻页：左右翻一屏（←/→ 键或浮钮）；搜索命中按屏跳；当前命中高亮 ----
function pageFlip(dir){
  const c=$("content");
  if(!curBook||!chapters[curChap]||$("pdfview").style.display!=="none")return;
  const h=c.clientHeight;
  if(h<=0)return;
  if(dir>0 && c.scrollTop+c.clientHeight>=c.scrollHeight-2)return;   // 已到末页，不再翻
  if(dir<0 && c.scrollTop<=0)return;                                  // 已到首页
  // v5.2 翻页吃字修复：落点对齐行首——翻页分界线压着的那行字保持完整，
  // 以它的行顶作新页开头，不再把一行切成上下两半
  const fold=c.scrollTop+dir*h;                                       // 目标分界线的文档坐标
  if(fold<=0){ c.scrollTo({top:0,behavior:"smooth"}); return; }
  // 先瞬移到目标位置，再读顶边压住的行（caretRangeFromPoint 只能取视口内的点）
  const keep=c.scrollTop;
  c.scrollTop=Math.max(0,Math.min(fold,c.scrollHeight-h));
  let top=null;                                                       // 顶边压住那行的行顶（文档坐标）
  try{
    const cRect=c.getBoundingClientRect();
    const cr=document.caretRangeFromPoint(cRect.left+c.clientWidth/2, cRect.top+2);
    if(cr && cr.startContainer.nodeType===3){
      const rg=document.createRange();
      rg.setStart(cr.startContainer,cr.startOffset);
      rg.setEnd(cr.startContainer,Math.min(cr.startContainer.length,cr.startOffset+1));
      const rc=rg.getBoundingClientRect();
      if(rc.height) top=rc.top-cRect.top+c.scrollTop;
    }
  }catch(e){}
  const aligned=Math.abs(top-c.scrollTop)<=1;                         // 顶边正好是行首，整屏翻就行
  const progress=dir>0 ? top>keep+1 : top<keep-1;
  if(top!=null && !aligned && progress){
    c.scrollTo({top:top,behavior:"smooth"});                          // 行被压住 → 以行顶作新页首，行完整了
  }else{
    c.scrollTo({top:fold,behavior:"smooth"});                         // 没压住行 / 界外 → 维持整屏翻
  }
}
// 把命中对齐到页首：v5.2 改为对齐命中所在行的行顶（原按整屏取整会把行切半）
function snapToScreen(el){
  const c=$("content");
  const h=c.clientHeight;
  if(h<=0){el.scrollIntoView({block:"center"});return;}
  let top=null;
  try{
    const r=el.getBoundingClientRect();
    const cr=document.caretRangeFromPoint(r.left+r.width/2, r.top+1);
    if(cr && cr.startContainer.nodeType===3){
      const rg=document.createRange();
      rg.setStart(cr.startContainer,cr.startOffset);
      rg.setEnd(cr.startContainer,Math.min(cr.startContainer.length,cr.startOffset+1));
      const rc=rg.getBoundingClientRect();
      if(rc.height) top=rc.top-c.getBoundingClientRect().top+c.scrollTop;
    }
  }catch(e){}
  if(top==null) top=el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop;
  top=Math.max(0,Math.min(top,c.scrollHeight-h));
  c.scrollTo({top:top,behavior:"smooth"});
}
$("pgPrev").onclick=()=>pageFlip(-1);
$("pgNext").onclick=()=>pageFlip(1);
// 首页/尾页：一键回本节开头 / 跳到本节末尾
$("pgHome").onclick=()=>{ if(!curBook||!chapters[curChap]||$("pdfview").style.display!=="none")return; $("content").scrollTo({top:0,behavior:"smooth"}); };
$("pgEnd").onclick=()=>{ if(!curBook||!chapters[curChap]||$("pdfview").style.display!=="none")return; const c=$("content"); c.scrollTo({top:c.scrollHeight,behavior:"smooth"}); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){                                           // ESC：先关翻译气泡，再退沉浸
    if($("tranTip").style.display==="block"){ hideTran(); return; }
    if(document.body.classList.contains("immersive")) setImmersive(false);
    return;
  }
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;   // 输入框里不抢左右键
  pageFlip(e.key==="ArrowRight"?1:-1);
  e.preventDefault();
});

function renderChap(i){
  curChap=i;
  storeState({last_chapter:i});
  $("chapList").querySelectorAll(".chap").forEach((x,j)=>x.classList.toggle("active",j===i));
  renderBody();
  applySearch(false);   // 换章节时沿用当前搜索词，重新高亮但不跳
  $("content").scrollTop=0;
}

// 清除：一键清空书架、章节、正文和搜索，停掉朗读，抹掉自动恢复记录（路径框保留）
$("btnClearShelf").onclick=()=>{
  hideAudio();
  books=[];curBook=null;chapters=[];curChap=0;hits=[];hitIdx=-1;
  $("bookList").innerHTML='<div class="empty">加载文件夹后，书会出现在这里</div>';
  $("chapList").innerHTML='<div class="empty" style="padding:40px 10px">选一章节</div>';
  $("content").innerHTML='<div class="empty">开始阅读</div>';
  $("readerTitle").textContent="";
  $("searchInput").value="";$("searchCount").textContent="";
  // 从 PDF 视图切回阅读区（如果正开着 PDF）
  if($("pdfview").style.display!=="none"){
    $("pdfview").style.display="none";$("pdfFrame").src="about:blank";
    pdfPath="";pdfPage=1;pdfPages=0;pdfDoc=null;pdfLoadSeq++;   // PDF 翻页状态一并归零
    $("pdfCanvas").getContext("2d").clearRect(0,0,$("pdfCanvas").width,$("pdfCanvas").height);
    $("pdfCanvas2").getContext("2d").clearRect(0,0,$("pdfCanvas2").width,$("pdfCanvas2").height);
    $("reader").style.display="";$("splitChap").style.display="";
  }
  // 清除＝真清空：恢复记录（last_path/last_book/last_chapter）一起抹掉，
  // 重启不再弹回；✕ 正常关窗不受影响，照旧自动恢复
  storeState({last_path:"",last_book:"",last_chapter:0});
  msg($("scanMsg"),"已清空书架和阅读区（恢复记录一并抹掉，重启不再弹回）。","ok");
};

let speaking = false;      // 正在生成或播放音频
let ttsKey = null;         // 当前朗读任务的 key
let ttsPollTimer = null;   // 合成进度轮询定时器
let ttsSegFiles = [];      // 各段文件名（按序）
let ttsSegIdx = 0;         // 正在播放第几段
let ttsMode = "";          // "stream" 分段边合边播 / "full" 完整单文件
let ttsGen = 0;            // 代次：换语速/重读时递增，让旧的异步回调自动作废

function rateStr(){
  const mult=parseFloat($("rate").value);           // 1.2 表示 1.2 倍
  const pct=Math.round((mult-1)*100);               // edge-tts 用百分比：+20% / -40%
  return (pct>=0?"+":"")+pct+"%";
}

// 停止当前朗读 + 掐掉后台合成队列（换语速/重读/停止都走这里）
function cancelTts(){
  ttsGen++;
  if(ttsPollTimer){ clearInterval(ttsPollTimer); ttsPollTimer=null; }
  if(ttsKey){ fetch("/api/tts_cancel",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({key:ttsKey})}).catch(()=>{}); }
  const a=$("audio"); a.pause(); a.onended=null; a.removeAttribute("src"); a.load();
  a.classList.add("hidden"); $("btnStop").classList.add("hidden");
  speaking=false;
  const b=$("btnSpeak"); b.disabled=false; b.textContent="朗读本章";
}

// 播放一个音频文件（段或完整），onended 回调由调用方设置
function playAudioFile(name,onEnded){
  const a=$("audio");
  a.onended=onEnded||null;
  a.src="/api/audio?name="+encodeURIComponent(name);
  a.classList.remove("hidden");$("btnStop").classList.remove("hidden");
  a.play().catch(()=>{});
}

// 分段边合边播：等第 i 段就绪就播，播完接第 i+1 段；拼整完成后可切完整单文件换真进度
async function playSegments(gen,segs){
  let idx=0;
  while(idx<segs && gen===ttsGen){
    // 等当前段就绪
    let file=ttsSegFiles[idx];
    while(!file && gen===ttsGen){
      await new Promise(r=>setTimeout(r,400));
      const st=await api("/api/tts_status?key="+encodeURIComponent(ttsKey),null,8000).catch(()=>null);
      if(!st||!st.ok){ continue; }
      if(st.parts) ttsSegFiles=segs>0?Array.from({length:segs},(_,k)=>st.parts[k]||""):[];
      file=ttsSegFiles[idx];
      if(st.error){ msg($("ttsMsg"),"合成失败："+st.error,"err"); cancelTts(); return; }
    }
    if(gen!==ttsGen) return;
    ttsSegIdx=idx;
    msg($("ttsMsg"),"边合边播：第 "+(idx+1)+" / "+segs+" 段（进度条为本段，全文进度按段计）","ok");
    const thisIdx=idx;
    await new Promise(resolve=>{
      playAudioFile(file,()=>resolve());   // 本段播完 → resolve → 下一段
    });
    if(gen!==ttsGen) return;
    idx++;
  }
  // 所有段播完
  speaking=false;
  const b=$("btnSpeak"); b.disabled=false; b.textContent="朗读本章";
  msg($("ttsMsg"),"本章播放完毕。下次同章同语速点朗读，用完整音频秒开、进度条可拖全文。","ok");
}

$("btnSpeak").onclick=async()=>{
  if(speaking)return;
  if(!curBook||!chapters[curChap]){ msg($("ttsMsg"),"当前是使用说明页，先点「加载书架」装入书才能朗读。","err"); return; }
  const ch=chapters[curChap];
  const rate=rateStr();
  const key=curBook.path+"#"+curChap+"#"+rate;
  const gen=++ttsGen;
  speaking=true; ttsKey=key; ttsSegFiles=[]; ttsSegIdx=0;
  const b=$("btnSpeak"); b.disabled=true;
  const est=Math.max(3,Math.round(ch.text.length/160));
  b.textContent=`生成中…约${est>=60?Math.round(est/60)+"分钟":est+"秒"}`;
  msg($("ttsMsg"),"正在启动朗读（本章 "+ch.text.length+" 字）。首段合成完就开始播，不用等整章。","ok");
  let r;
  try{ r=await api("/api/tts_begin",{text:ch.text,key:key,rate:rate},20000); }
  catch(e){
    speaking=false;b.disabled=false;b.textContent="朗读本章";
    msg($("ttsMsg"),"启动失败："+(e.message||e),"err");return;
  }
  if(gen!==ttsGen) return;   // 期间被换语速/停止接管
  if(!r.ok){ speaking=false;b.disabled=false;b.textContent="朗读本章";msg($("ttsMsg"),r.error||"启动失败","err");return; }
  b.textContent="朗读中…";
  if(r.cached){
    // 完整缓存命中：单文件播放，原生进度条即全文真实进度
    ttsMode="full";
    msg($("ttsMsg"),"缓存命中，秒开；进度条可拖全文。","ok");
    playAudioFile(r.full,()=>{ speaking=false;b.disabled=false;b.textContent="朗读本章"; });
  }else{
    // 首次：分段边合边播
    ttsMode="stream";
    msg($("ttsMsg"),"首段合成中，好了就开始播；后台继续合成剩余段。","ok");
    // 轮询：把已就绪的段记下来；拼整完成后更新提示（下章秒开已落缓存）
    ttsPollTimer=setInterval(async()=>{
      if(gen!==ttsGen){ clearInterval(ttsPollTimer);ttsPollTimer=null;return; }
      const st=await api("/api/tts_status?key="+encodeURIComponent(key),null,8000).catch(()=>null);
      if(!st||!st.ok)return;
      if(st.parts) ttsSegFiles=Array.from({length:st.segs||r.segs},(_,k)=>st.parts[k]||"");
      if(st.done && st.full){
        msg($("ttsMsg"),"后台已拼成完整音频落缓存，下次秒开、进度条可拖全文。","ok");
        clearInterval(ttsPollTimer);ttsPollTimer=null;
      }
    },1200);
    playSegments(gen,r.segs);
  }
};
$("btnStop").onclick=()=>{ cancelTts(); };
// 换语速立即生效：直接掐掉旧任务（含后台队列），按新语速重来
$("rate").addEventListener("change",()=>{
  if(curBook&&chapters[curChap]){
    if(speaking) cancelTts();
    $("btnSpeak").click();
  }
});
$("btnQuit").onclick=async()=>{
  $("audio").pause();
  try{ await fetch("/api/quit",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }catch(e){}
  // 后端会关掉 Edge 窗口，这里不必再提示；万一窗口没关，给一句兜底
  setTimeout(()=>{ try{ document.body.innerHTML='<div style="text-align:center;padding:80px;font-family:Microsoft YaHei;font-size:18px;color:#9a98a8">已退出，可以关掉这个窗口了。</div>'; }catch(e){} }, 800);
};
// [demo] 全屏按钮 v2：正文沉浸视图——藏顶栏/书架/章节目录，只留阅读排＋正文；再点或 ESC 还原
function setImmersive(on){
  document.body.classList.toggle("immersive",on);
  $("btnFull").textContent=on?"还原":"全屏";
}
$("btnFull").onclick=()=>setImmersive(!document.body.classList.contains("immersive"));

// ---- [demo] v5.2 划词翻译：选中→浮「译」钮→点一下→气泡显示译文（只送选中的文字，≤500 字符） ----
function hideTran(){ $("btnTran").style.display="none"; $("tranTip").style.display="none"; }
function placeNear(el,rect){
  const box=$("content"), wrap=box.parentElement.getBoundingClientRect();
  const top=rect.bottom-wrap.top+box.scrollTop+6;
  const left=Math.min(Math.max(rect.left-wrap.left,8),wrap.width-el.offsetWidth-8);
  el.style.top=top+"px"; el.style.left=Math.max(left,8)+"px";
}
$("content").addEventListener("mouseup",e=>{
  if(e.target.id==="btnTran") return;
  setTimeout(()=>{                                  // 等选区稳定
    const sel=window.getSelection();
    const text=(sel?sel.toString():"").trim();
    const btn=$("btnTran"),tip=$("tranTip");
    tip.style.display="none";
    if(!text||text.length>500||!sel.rangeCount){ btn.style.display="none"; return; }
    const r=sel.getRangeAt(0).getBoundingClientRect();
    if(!r.width){ btn.style.display="none"; return; }
    btn.style.display="block";
    placeNear(btn,{left:r.left,right:r.bottom,bottom:r.bottom});
    btn.onclick=async()=>{
      tip.innerHTML="<div class='t-src'>"+esc(text.slice(0,80))+(text.length>80?"…":"")+"</div>翻译中…";
      tip.style.display="block"; placeNear(tip,{left:r.left,right:r.bottom,bottom:r.bottom});
      try{
        const res=await api("/api/translate",{text});
        if(res.ok){ tip.innerHTML="<div class='t-src'>"+esc(text.slice(0,80))+(text.length>80?"…":"")
          +"　<span style='color:var(--muted)'>（"+esc(res.detected||"?")+"）</span></div>"+esc(res.text); }
        else{ tip.innerHTML="翻译没成功："+esc(res.error||"未知原因")+"，检查网络再试"; }
      }catch(err){ tip.innerHTML="翻译没成功："+esc(err.message)+"，检查网络再试"; }
      placeNear(tip,{left:r.left,right:r.bottom,bottom:r.bottom});
    };
  },0);
});
$("content").addEventListener("mousedown",e=>{
  if(e.target.id!=="btnTran"&&e.target.id!=="tranTip") hideTran();
});
// ---- v5.1：PDF.js 本地渲染 —— canvas 换页瞬跳、缩放/双页跨翻页保持，失败回退内建阅读器 ----
let pdfPath="", pdfPage=1, pdfPages=0, pdfDoc=null, pdfSpreadMode=false, pdfZoom="fit";
let pdfRenderTask=null, pdfLoadSeq=0;

// 动态加载 pdf.js（ES module），加载失败返回 false → 走内建阅读器兜底
let pdfjsLib=null, pdfjsReady=null;
function loadPdfjs(){
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady=import("./pdfjs/pdf.min.mjs").then(lib=>{
    lib.GlobalWorkerOptions.workerSrc="./pdfjs/pdf.worker.min.mjs";
    pdfjsLib=lib; return true;
  }).catch(e=>{ console.warn("pdf.js 加载失败，回退内建阅读器",e); return false; });
  return pdfjsReady;
}

function pdfUseFallback(){
  $("pdfCanvasWrap").style.display="none";
  $("pdfFallback").style.display="flex";
  $("pdfZoom").style.display="none";
  $("pdfSpread").style.display="none";
}

async function pdfRenderPage(){
  if(!pdfDoc) return;
  const seq=pdfLoadSeq;
  // 适配模式：按容器高度算缩放，让整页放下；否则用选定倍率
  const p1=await pdfDoc.getPage(pdfPage);
  let scale=pdfZoom==="fit" ? Math.max(0.3,Math.min(2.5,($("pdfCanvasWrap").clientHeight-40)/p1.getViewport({scale:1}).height)) : Number(pdfZoom);
  if(seq!==pdfLoadSeq) return;   // 翻页太快，丢弃过期渲染
  const dpr=window.devicePixelRatio||1;
  const vp=p1.getViewport({scale:scale*dpr});
  const c1=$("pdfCanvas"), ctx1=c1.getContext("2d");
  c1.width=vp.width;c1.height=vp.height;
  c1.style.width=(vp.width/dpr)+"px";c1.style.height=(vp.height/dpr)+"px";
  if(pdfRenderTask) try{ pdfRenderTask.cancel(); }catch(e){}
  pdfRenderTask=p1.render({canvasContext:ctx1,viewport:vp});
  try{ await pdfRenderTask.promise; }catch(e){ if(e && e.name==="RenderingCancelledException")return; }
  // 双页：渲染第 pdfPage+1 页到第二块 canvas
  const c2=$("pdfCanvas2");
  if(pdfSpreadMode && pdfPage+1<=pdfPages){
    c2.classList.remove("hidden");
    const p2=await pdfDoc.getPage(pdfPage+1);
    const vp2=p2.getViewport({scale:scale*dpr});
    c2.width=vp2.width;c2.height=vp2.height;
    c2.style.width=(vp2.width/dpr)+"px";c2.style.height=(vp2.height/dpr)+"px";
    if(pdfRenderTask) try{ pdfRenderTask.cancel(); }catch(e){}
    pdfRenderTask=p2.render({canvasContext:c2.getContext("2d"),viewport:vp2});
    try{ await pdfRenderTask.promise; }catch(e){}
  }else{
    c2.classList.add("hidden");
  }
  pdfLabel();
}

function pdfLabel(){
  if(pdfSpreadMode && pdfPages){
    $("pdfPageNo").textContent="第 "+pdfPage+"–"+Math.min(pdfPage+1,pdfPages)+" / "+pdfPages+" 页";
  }else{
    $("pdfPageNo").textContent=pdfPages?("第 "+pdfPage+" / "+pdfPages+" 页"):"第 "+pdfPage+" 页";
  }
}

function pdfGo(p){
  if(!pdfPath)return;
  const step=pdfSpreadMode?2:1;
  const max=pdfPages||p;
  pdfPage=Math.max(1,Math.min(p,max));
  pdfLoadSeq++;   // 作废过期的异步渲染
  pdfRenderPage();
}

async function pdfOpen(path){
  pdfPath=path; pdfPage=1; pdfPages=0; pdfLoadSeq=0; pdfDoc=null;
  pdfLoadSeq++;
  $("pdfCanvasWrap").style.display="flex";
  $("pdfFallback").style.display="none";
  $("pdfZoom").style.display="";
  $("pdfSpread").style.display="";
  $("pdfPageNo").textContent="加载中…";
  const ok=await loadPdfjs();
  if(!ok){ // 回退：内建阅读器整载（v5.1 老路）
    pdfUseFallback();
    $("pdfFrame").src="/api/pdf?path="+encodeURIComponent(path)+"#page=1&zoom=page-fit";
    api("/api/pdfpages?path="+encodeURIComponent(path),null,8000)
      .then(r=>{ pdfPages=r.pages||0; pdfLabel(); $("pdfEnd").style.display=pdfPages?"":"none"; })
      .catch(()=>{ $("pdfEnd").style.display="none"; });
    return;
  }
  try{
    const loadingTask=pdfjsLib.getDocument("/api/pdf?path="+encodeURIComponent(path));
    pdfDoc=await loadingTask.promise;
    pdfPages=pdfDoc.numPages;
    pdfLabel();
    $("pdfEnd").style.display="";
    pdfRenderPage();
    msg($("scanMsg"),"PDF 已用本地渲染打开：翻页瞬跳、缩放/双页跨页保持。滚轮翻页。","ok");
  }catch(e){
    console.warn("pdf.js 解析失败，回退内建阅读器",e);
    pdfUseFallback();
    $("pdfFrame").src="/api/pdf?path="+encodeURIComponent(path)+"#page=1&zoom=page-fit";
    msg($("scanMsg"),"本地渲染打不开这个 PDF，已回退内建阅读器。","warn");
  }
}

$("pdfHome").onclick=()=>pdfGo(1);
$("pdfPrev").onclick=()=>pdfGo(pdfPage-(pdfSpreadMode?2:1));
$("pdfNext").onclick=()=>pdfGo(pdfPage+(pdfSpreadMode?2:1));
$("pdfEnd").onclick=()=>{ if(pdfPages) pdfGo(pdfSpreadMode?Math.max(1,pdfPages-1):pdfPages); };
$("pdfZoom").addEventListener("change",()=>{ pdfZoom=$("pdfZoom").value; if(pdfDoc) pdfRenderPage(); });
$("pdfSpread").onclick=()=>{
  pdfSpreadMode=!pdfSpreadMode;
  $("pdfSpread").textContent=pdfSpreadMode?"单页":"双页";
  if(pdfDoc) pdfRenderPage();
};
// 滚轮按页翻（pdf.js 渲染区），跟按钮同一套页格；grep pdfCanvasWrap 容器
$("pdfCanvasWrap").addEventListener("wheel",e=>{
  if(!pdfDoc) return;
  if(Math.abs(e.deltaY)<8) return;
  e.preventDefault();
  pdfGo(pdfPage+(e.deltaY>0?1:-1));
},{passive:false});

$("btnClosePdf").onclick=()=>{
  pdfPath="";pdfPage=1;pdfPages=0;pdfDoc=null;pdfLoadSeq++;
  $("pdfCanvas").getContext("2d").clearRect(0,0,$("pdfCanvas").width,$("pdfCanvas").height);
  $("pdfCanvas2").getContext("2d").clearRect(0,0,$("pdfCanvas2").width,$("pdfCanvas2").height);
  $("pdfview").style.display="none";
  $("pdfFrame").src="about:blank";
  $("reader").style.display="";
  $("splitChap").style.display="";
  $("readerTitle").textContent="";
  $("bookList").querySelectorAll(".item").forEach(x=>x.classList.remove("active"));
  hideAudio();
};
</script>
